# Production stack for ZamTech AI.
#   cd deploy && ./init-env.sh && docker compose up -d --build
# Optional cloud bot agent:  docker compose --profile agent up -d --build
name: zamtest

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        SITE_DOMAIN: ${SITE_DOMAIN}
        # Shown as "Contact sales" for Enterprise on the Billing page (rebuild after changing).
        SALES_EMAIL: ${SALES_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - orchestrator
    restart: unless-stopped

  # The platform's data (docs/DEPLOYMENT.md, "Data and Postgres"). Only the orchestrator reaches it.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zamtech
      POSTGRES_USER: zamtech
      POSTGRES_PASSWORD: ${ZAMTEST_DB_PASSWORD:?run deploy/install.sh to create ZAMTEST_DB_PASSWORD}
    # Small instances (2 GB): modest memory.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zamtech -d zamtech"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: orchestrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # On first start, the data of an existing /data/db.json moves into Postgres (the file is kept, renamed).
      ZAMTEST_DATABASE_URL: postgres://zamtech:${ZAMTEST_DB_PASSWORD}@postgres:5432/zamtech
      ZAMTEST_ADMIN_TOKEN: ${ZAMTEST_ADMIN_TOKEN}
      ZAMTEST_AGENT_KEY: ${ZAMTEST_AGENT_KEY}
      ZAMTEST_CORS_ORIGINS: https://portal.${SITE_DOMAIN},https://designer.${SITE_DOMAIN},https://${SITE_DOMAIN}
      # One sign-in for the Portal and the Designer (a cookie on the parent domain),
      # and where approval links for new bot PCs point.
      ZAMTEST_COOKIE_DOMAIN: .${SITE_DOMAIN}
      ZAMTEST_PORTAL_URL: https://portal.${SITE_DOMAIN}
      ZAMTEST_DESIGNER_URL: https://designer.${SITE_DOMAIN}
      # Anyone may create an account and workspace in the Portal (the hosted service).
      ZAMTEST_ALLOW_SIGNUP: ${ZAMTEST_ALLOW_SIGNUP:-false}
      # Days to keep step screenshots of jobs (docs/DEPLOYMENT.md, 6b).
      ZAMTEST_SCREENSHOT_DAYS: ${ZAMTEST_SCREENSHOT_DAYS:-30}
      # Confirm-your-email and password-reset emails (see docs/DEPLOYMENT.md, 5c).
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Paying for Pro with Stripe (optional; see docs/DEPLOYMENT.md, "Plans and billing").
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_BUILDER_MONTHLY: ${STRIPE_PRICE_BUILDER_MONTHLY:-}
      STRIPE_PRICE_BOT_MONTHLY: ${STRIPE_PRICE_BOT_MONTHLY:-}
      STRIPE_PRICE_BUILDER_YEARLY: ${STRIPE_PRICE_BUILDER_YEARLY:-}
      STRIPE_PRICE_BOT_YEARLY: ${STRIPE_PRICE_BOT_YEARLY:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-false}
      STRIPE_PORTAL_CONFIGURATION: ${STRIPE_PORTAL_CONFIGURATION:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ZAMTEST_AI_MODEL: ${ZAMTEST_AI_MODEL:-}
      # The help assistant (Docs): a lighter model; and where it sends people for more help.
      ZAMTEST_HELP_MODEL: ${ZAMTEST_HELP_MODEL:-}
      ZAMTEST_SUPPORT_EMAIL: ${ZAMTEST_SUPPORT_EMAIL:-}
      # Product update emails: the company postal address the law requires in them (US CAN-SPAM).
      ZAMTEST_COMPANY_ADDRESS: ${ZAMTEST_COMPANY_ADDRESS:-}
      ZAMTEST_SITE_URL: https://${SITE_DOMAIN}
      # Nightly S3 backups (optional; see docs/DEPLOYMENT.md)
      ZAMTEST_BACKUP_S3_BUCKET: ${ZAMTEST_BACKUP_S3_BUCKET:-}
      ZAMTEST_BACKUP_S3_PREFIX: ${ZAMTEST_BACKUP_S3_PREFIX:-zamtest/}
      ZAMTEST_BACKUP_S3_REGION: ${ZAMTEST_BACKUP_S3_REGION:-}
      ZAMTEST_BACKUP_CRON: ${ZAMTEST_BACKUP_CRON:-0 3 * * *}
      ZAMTEST_BACKUP_KEEP_DAYS: ${ZAMTEST_BACKUP_KEEP_DAYS:-30}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - zamtest_data:/data
    restart: unless-stopped

  agent:
    profiles: ["agent"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: agent
    environment:
      ZAMTEST_SERVER: http://orchestrator:4000
      ZAMTEST_AGENT_KEY: ${ZAMTEST_AGENT_KEY}
      ZAMTEST_AGENT_NAME: ${ZAMTEST_AGENT_NAME:-cloud-bot-1}
      ZAMTEST_HEADLESS: "1"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    shm_size: 1gb
    depends_on:
      - orchestrator
    restart: unless-stopped

volumes:
  postgres_data:
  zamtest_data:
  caddy_data:
  caddy_config:
