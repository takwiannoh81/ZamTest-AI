<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZamTech AI - AI-powered RPA and test automation platform</title>
    <meta name="description" content="Low-code RPA and test automation with AI built in. AI writes your tests, fixes failed runs and repairs broken selectors. Automate websites and Windows apps, schedule runs, get alerts and reports. Free plan, 14 languages." />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://zamtechai.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZamTech AI" />
    <meta property="og:url" content="https://zamtechai.com/" />
    <meta property="og:title" content="ZamTech AI - AI-powered RPA and test automation" />
    <meta property="og:description" content="AI writes your tests, fixes failed runs and repairs broken selectors. Automate websites and Windows apps from one portal. Free plan available." />
    <meta property="og:image" content="https://zamtechai.com/designer.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZamTech AI - AI-powered RPA and test automation" />
    <meta name="twitter:description" content="AI writes your tests, fixes failed runs and repairs broken selectors. Free plan available." />
    <meta name="twitter:image" content="https://zamtechai.com/designer.png" />
    <meta name="theme-color" content="#4f46e5" />
    <!-- What the site is, for search engines (shown as rich results). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://zamtechai.com/#organization",
            "name": "ZamTech AI",
            "legalName": "ZAMTECH&HOME LLC",
            "url": "https://zamtechai.com/",
            "logo": "https://zamtechai.com/favicon.svg"
          },
          {
            "@type": "SoftwareApplication",
            "name": "ZamTech AI",
            "url": "https://zamtechai.com/",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Robotic process automation and test automation",
            "operatingSystem": "Web, Windows",
            "description": "Low-code RPA and test automation platform with AI: AI-generated tests, Fix with AI, self-healing selectors, schedules, alerts, test reports and bot agents for websites and Windows applications.",
            "image": "https://zamtechai.com/designer.png",
            "publisher": { "@id": "https://zamtechai.com/#organization" },
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD", "description": "Free plan" }
          }
        ]
      }
    </script>
    <!-- The chosen colours (Light/Dark), before the page draws, so it does not flash. -->
    <script>
      try {
        var t = /(?:^|;\s*)zt_theme=(light|dark)/.exec(document.cookie);
        if (t) document.documentElement.setAttribute("data-theme", t[1]);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
