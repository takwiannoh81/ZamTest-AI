name: Agent installer (Windows)

# installer: on every change to the agent, builds an unsigned
#   ZamTechAI-Agent-Setup-<version>.exe, installs it silently, checks it,
#   uninstalls it and keeps the setup file as a download on the run.
#
# release: on a tag agent-v<version>, builds the installer signed with Azure
#   Artifact Signing (account and profile in apps/agent/installer/artifact-signing.json),
#   checks the signatures, and publishes a GitHub Release, also as
#   ZamTechAI-Agent-Setup.exe, which the Portal's "Download for Windows" button
#   links to (releases/latest/download/...).
#
#   Runs in the GitHub environment "release", whose secrets AZURE_CLIENT_ID,
#   AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID identify an Entra app that has a
#   federated credential for this repository's "release" environment and the
#   Artifact Signing Certificate Profile Signer role. No password is stored.
#
# Releasing: raise "version" in apps/agent/package.json, commit, then
#   git tag agent-v<version> && git push origin agent-v<version>
on:
  push:
    # With tags listed, branches must be listed too or branch pushes are skipped.
    # The paths filter applies to branch pushes only; tag pushes always run.
    branches: ["**"]
    tags: ["agent-v*"]
    paths:
      - "apps/agent/**"
      - "packages/**"
      - ".github/workflows/agent-installer.yml"
  workflow_dispatch:

jobs:
  installer:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Inno Setup if the runner lacks it
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the installer (unsigned)
        run: pnpm --filter @zamtest/agent build:installer
      - name: Install silently, check and uninstall
        shell: pwsh
        run: apps/agent/installer/test-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: zamtechai-agent-setup-unsigned
          path: apps/agent/dist/installer/ZamTechAI-Agent-Setup-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign in to Azure without a stored password
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the agent version
        shell: pwsh
        run: |
          $version = (Get-Content apps/agent/package.json -Raw | ConvertFrom-Json).version
          if ("agent-v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match apps/agent/package.json version $version" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Inno Setup if the runner lacks it
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      # The Artifact Signing plug-in for signtool runs on .NET 8.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build the signed installer
        run: pnpm --filter @zamtest/agent build:installer
        env:
          ZAMTEST_ARTIFACT_SIGNING: "1"
      - name: Check signatures, install silently, check and uninstall
        shell: pwsh
        run: apps/agent/installer/test-install.ps1 -Signed
      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem apps/agent/dist/installer/ZamTechAI-Agent-Setup-*.exe | Select-Object -First 1
          $stable = Join-Path $setup.DirectoryName 'ZamTechAI-Agent-Setup.exe'
          Copy-Item $setup.FullName $stable
          $version = "${{ github.ref_name }}".Substring('agent-v'.Length)
          $notes = "ZamTech AI Agent $version for Windows 10/11 (x64), signed by ZAMTECH&HOME LLC.`n`nDownload **ZamTechAI-Agent-Setup.exe**, run it and enter your server address and agent key.`n`nSilent install: ``ZamTechAI-Agent-Setup.exe /VERYSILENT /SERVER=https://api.zamtechai.com /KEY=<agent key>``"
          gh release create "${{ github.ref_name }}" $setup.FullName $stable --title "ZamTech AI Agent $version" --notes $notes
